<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <filter id="ink" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" seed="31" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="3.8" intercept="-1.4"/>
      <feFuncG type="linear" slope="3.8" intercept="-1.4"/>
      <feFuncB type="linear" slope="3.8" intercept="-1.4"/>
    </feComponentTransfer>
  </filter>
  <rect width="180" height="180" filter="url(#ink)" opacity=".9"/>
</svg>
